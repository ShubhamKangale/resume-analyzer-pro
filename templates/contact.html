{% extends "base.html" %}
{% block title %}Contact Us &mdash; AI Resume Analyzer{% endblock %}

{% block content %}
<section class="wrap contact-wrap">
  <div class="contact-card">
    <h1>Contact Us</h1>
    <p class="auth-sub">Questions, feedback or found a bug? Reach out &mdash; we'd love to hear from you.</p>

    <p class="contact-row"><strong>Email:</strong>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>

    <p class="contact-row"><strong>Follow us:</strong></p>
    <div class="social-row social-row-dark">
      <a class="social-btn" href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="social-btn" href="{{ site.youtube }}" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="social-btn" href="{{ site.instagram }}" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </div>
</section>
{% endblock %}
