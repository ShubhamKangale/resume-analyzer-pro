{% extends "base.html" %}
{% block title %}Reset password &mdash; AI Resume Analyzer{% endblock %}

{% block content %}
<section class="wrap auth-wrap">
  <form class="auth-card" method="POST" action="{{ url_for('reset_password', token=token) }}" novalidate>
    <h1>Choose a new password</h1>
    <p class="auth-sub">Pick something you haven't used elsewhere.</p>

    <label for="password">New password</label>
    <input type="password" id="password" name="password" required minlength="6" autofocus placeholder="At least 6 characters">

    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Re-type the password">

    <button type="submit" class="btn-primary btn-block">Update password</button>
  </form>
</section>
{% endblock %}
