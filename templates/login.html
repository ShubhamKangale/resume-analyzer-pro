{% extends "base.html" %}
{% block title %}Log in &mdash; AI Resume Analyzer{% endblock %}

{% block content %}
<section class="wrap auth-wrap">
  <form class="auth-card" method="POST" action="{{ url_for('login') }}" novalidate>
    <h1>Log in</h1>
    <p class="auth-sub">Pick up where you left off.</p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="Your password">

    <p class="auth-switch" style="text-align:right;margin:8px 0 0"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>

    <button type="submit" class="btn-primary btn-block">Log in</button>

    <p class="auth-switch">Didn't get the verification email? <a href="{{ url_for('resend_verification') }}">Resend it</a></p>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
