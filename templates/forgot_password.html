{% extends "base.html" %}
{% block title %}Forgot password &mdash; AI Resume Analyzer{% endblock %}

{% block content %}
<section class="wrap auth-wrap">
  <form class="auth-card" method="POST" action="{{ url_for('forgot_password') }}" novalidate>
    <h1>Forgot password?</h1>
    <p class="auth-sub">Enter your account email and we'll send you a link to reset your password.</p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">

    <button type="submit" class="btn-primary btn-block">Send reset link</button>

    <p class="auth-switch">Remembered it? <a href="{{ url_for('login') }}">Back to log in</a></p>
  </form>
</section>
{% endblock %}
